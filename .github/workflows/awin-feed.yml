name: Build AWIN feed

on:
  schedule:
    - cron: '0 6 * * *'      # every day at 06:00 UTC
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write              # allow the job to commit the updated feed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the feed from Shopify
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python build_awin_feed.py
      - name: Write heartbeat and commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_built.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add awin_feed.csv last_built.txt
          git commit -m "awin feed $(date -u +%F_%H:%M)" || { echo "nothing to commit"; exit 0; }
          # Push with rebase + retry so a transient remote rejection
          # (e.g. "fatal error in commit_refs") or a race does not fail the run.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push attempt $i failed; retrying in $((i*10))s"
            sleep $((i*10))
          done
          echo "push failed after 5 attempts"; exit 1
